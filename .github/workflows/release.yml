name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate version tag
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Verify public update hosting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility="$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)"
          if [[ "$visibility" != "public" ]]; then
            echo "Margin releases must be public because installed apps cannot authenticate to the Sparkle feed."
            exit 1
          fi
      - name: Build DMG
        run: ./scripts/package-dmg.sh
      - name: Generate signed update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | .build/sparkle-2.9.6/bin/generate_appcast \
            --ed-key-file - \
            --maximum-deltas 0 \
            --download-url-prefix "https://github.com/valetivivek/Margin/releases/download/$GITHUB_REF_NAME/" \
            --link "https://github.com/valetivivek/Margin" \
            -o "$GITHUB_WORKSPACE/dist/appcast.xml" \
            "$GITHUB_WORKSPACE/dist"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '/^## / { if (found) exit; found = ($2 == version); next } found { print }' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.sha256 dist/appcast.xml --notes-file "$RUNNER_TEMP/release-notes.md" --title "Margin $GITHUB_REF_NAME"
      - name: Verify published update feed
        run: |
          curl --fail --location --retry 5 --retry-all-errors --output /dev/null \
            "https://github.com/valetivivek/Margin/releases/latest/download/appcast.xml"

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate version tag
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Verify public update hosting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility="$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)"
          if [[ "$visibility" != "public" ]]; then
            echo "Margin releases must be public because installed apps cannot authenticate to the Sparkle feed."
            exit 1
          fi
      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          test -n "$APPLE_CERTIFICATE_BASE64"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/margin-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application:/ { print $2; exit }')"
          test -n "$identity"
          echo "CODE_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Configure notarization
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          xcrun notarytool store-credentials margin-notary \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --keychain "$RUNNER_TEMP/margin-signing.keychain-db"
          echo "NOTARY_PROFILE=margin-notary" >> "$GITHUB_ENV"
          echo "NOTARY_KEYCHAIN=$RUNNER_TEMP/margin-signing.keychain-db" >> "$GITHUB_ENV"
      - name: Build DMG
        run: ./scripts/package-dmg.sh
      - name: Generate signed update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | .build/sparkle-2.9.6/bin/generate_appcast \
            --ed-key-file - \
            --maximum-deltas 0 \
            --download-url-prefix "https://github.com/valetivivek/Margin/releases/download/$GITHUB_REF_NAME/" \
            --link "https://github.com/valetivivek/Margin" \
            -o "$GITHUB_WORKSPACE/dist/appcast.xml" \
            "$GITHUB_WORKSPACE/dist"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '/^## / { if (found) exit; found = ($2 == version); next } found { print }' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.sha256 dist/appcast.xml --notes-file "$RUNNER_TEMP/release-notes.md" --title "Margin $GITHUB_REF_NAME"
      - name: Verify published update feed
        run: |
          curl --fail --location --retry 5 --retry-all-errors --output /dev/null \
            "https://github.com/valetivivek/Margin/releases/latest/download/appcast.xml"
